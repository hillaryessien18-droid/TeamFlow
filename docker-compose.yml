# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow-pgdata:/var/lib/postgresql/data

volumes:
  teamflow-pgdata:
